  - id: addbiomechanics.source_wrap_filter_defect_repaired
    kind: source_defect
    severity: caution
    scope:
      level: bundle
    statement: 'AddBiomechanics'' own lowPassFilter pass filtered wrapped angles (pelvis_rotation, arm_rot_r,
      arm_flex_r) as plain scalars, smearing 2-pi steps into overshoots past pi; the defect is upstream
      of this repository. The retarget corpus addbio_smpl24_raw (spec retarget-v2) repairs only the coordinates
      that actually wrapped by re-filtering the unwrapped kinematics pass with the source''s own declared
      filter (order 2, 30 Hz): 2,112 of 40,484 takes (pelvis_rotation 2,012, arm_rot_r 93, arm_flex_r
      37; 30 takes with two coordinates). A repaired coordinate loses the source''s dynamics-pass refinement
      (up to 0.306 rad observed).'
    consequence: A take whose manifest wrap_repaired_coordinates is non-empty carries a re-filtered coordinate
      rather than the source's dynamics value; an empty string means checked and untouched. The retired
      2026-08-30 generation carried the defect unmarked (its evidence stays under _superseded/addbio_unified8_v1/)
      and must not be used in its place.
    evidence: manifest.json wrap_repaired_coordinates (additive key, configs/datasets/dataset_profiles_v1.yaml
      profiles.addbiomechanics.additive.manifest_keys); AddBio wrap-repair record (parent project record, 2026-08-31)
      sections 1, 1.2, 3.1 and 4; AddBio synthetic-IMU conversion record (parent project record, 2026-08-30)
      section 4.2
    status: mitigated
    mitigation: src/soma_synthetic_imu/addbio_retarget/wrap_repair.py re-filters wrapped coordinates from
      the kinematics pass (retarget-v2); every manifest records the repaired coordinate names in wrap_repaired_coordinates;
      pose-level exclusions fell from 2,034 (the retired 2026-08-30 generation) to 24 with no new exclusions.
    since: '2026-08-31'
    related:
