  - id: addbiomechanics.resample_sets_bandwidth
    kind: approximation
    severity: info
    scope:
      level: bundle
      arrays:
      - timestamps_s
    statement: Source rates run 61-251 Hz against the 100 Hz target and 40,102 takes are downsampled (Slerp
      on local rotations, linear on translation) before differentiation; against differentiating at the
      native rate the p95 gyro difference is 1.6-20% and concentrates in fast transients. The record calls
      this the bandwidth set by the target rate, not a conversion error.
    consequence: Rotational peaks above the 100 Hz Nyquist band are not represented; compare against other
      100 Hz data, not against native-rate derivatives.
