# What each bundle cannot promise, in the one shape every bundle shares.
#
# Schema and rules: src/soma_synthetic_imu/contracts/dataset_limitations.py and
# docs/guides/KNOWN_LIMITATIONS.md. Rendered into each bundle root as KNOWN_LIMITATIONS.json by
# scripts/write_known_limitations.py; the validator checks the rendered copy against this file.
#
# Every entry names the exact place a reader verifies it. Nothing here is a guess: a suspected
# limitation without evidence belongs in an investigation document, not in this file.
#
# This file states no threshold and no tolerance (DETERMINISTIC_EXECUTION_CONFIG_HOLD).
# A limitation is stated, scoped and attributed, never scored.
#
# Bundle keys are lineage names without a version suffix (retention rule 1.1, 2026-09-14):
# one directory per lineage, replaced in place when regenerated. A block therefore describes
# the lineage's current generation; an entry that a regeneration closed is kept with
# status fixed and fixed_in rather than deleted, so a reader of older figures can see what
# changed. A block may predate the regeneration of a lineage that has been retired.

schema: dataset_limitations_v1
bundles:
  prism_faithful_full:
  - id: prism.internal_only
    kind: rights
    severity: do_not_use
    scope:
      level: bundle
    statement: 'distribution_scope is internal_only. PRISM is a form-scoped internal dataset: non-commercial
      academic research only, no redistribution, no commercial purpose, not publicly citable; no official
      licence, DUA or provider authorisation exists (license_id form_scoped_internal_noncommercial_no_redistribution,
      publication NOT_ESTABLISHED).'
    consequence: Do not upload to any public Git, cloud, model or dataset hub, or share by public link;
      do not redistribute or cite it as a public dataset.
    evidence: DATA_DESCRIPTION_EN.md 'Scope & handling (read first)' bullet 1; manifest.json distribution_scope,
      source_attribution.license_id, source_attribution.publication, source_attribution.attribution_note
      (all 150 takes); INDEX.json distribution_scope; configs/datasets/source_attribution_v1.yaml sources.prism
    status: open
    since: '2026-08-18'
    related:
    - prism.experimental_non_candidate
  - id: prism.experimental_non_candidate
    kind: rights
    severity: do_not_use
    scope:
      level: bundle
    statement: 'artifact_class is experimental_non_candidate and quality_gate is NOT_EVALUATED: a measured-sensor
      simulation reference, not canonical output, not contract-compliant, and no production quality gate
      (PHYSICS_QUALITY_GATES.md) was applied. The PRISM usage policy records that PRISM_SOURCE_PASS is
      not satisfied.'
    consequence: Do not use the bundle as a training or evaluation label, and do not cite it as gate-passing
      or contract-compliant output; a validation PASS is not a quality-gate judgement.
    evidence: DATA_DESCRIPTION_EN.md 'Scope & handling' bullet 2 and section 7 'unavailable / not applied'
      row; manifest.json artifact_class, artifact_label, quality_gate, unavailable_or_not_applied 'quality
      gates (PHYSICS_QUALITY_GATES.md)'; configs/datasets/prism_usage_policy_v1.yaml does_not_satisfy
    status: open
    since: '2026-08-18'
    related:
    - prism.internal_only
  - id: prism.official_split_chunk_leakage
    kind: coverage
    severity: caution
    scope:
      level: bundle
    statement: 'The cohort is six subjects and 150 takes, and PRISM''s official split is chunk-level (seed
      42): 126 of 150 takes contribute to both train and test, so test performance includes temporally
      adjacent chunks of the same take. The usage policy makes this disclosure mandatory.'
    consequence: Test scores on the official split are not an across-take or across-subject generalisation
      bound; an across-subject claim needs a separate grouped analysis, and the disclosure must accompany
      any reported score.
    evidence: DATA_DESCRIPTION_EN.md 'Scope & handling' bullet 3; configs/datasets/prism_usage_policy_v1.yaml
      evaluation_split (takes_on_both_sides 126, mandatory_disclosures)
    status: open
    since: '2026-08-18'
  - id: prism.emg_excluded
    kind: source_scope
    severity: info
    scope:
      level: bundle
    statement: EMG is an excluded modality; the recorded reason is not_in_synthetic_artifact_scope.
    consequence: No EMG channel exists in any deliverable; do not expect or derive one from this bundle.
    evidence: manifest.json excluded_modalities ['emg'] and excluded_modality_reasons.emg (all 150 takes)
    status: open
    since: '2026-08-18'
  - id: prism.back_t4_spine3_proxy
    kind: proxy
    severity: caution
    scope:
      level: site
      sites:
      - back_T4
      arrays:
      - imu_orientation
      - imu_acceleration
      - imu_angular_velocity
      - imu_confidence
      - gyro_provenance
      - q_anatomical_from_sensor
    statement: 'PRISM has no trunk/T4 sensor. back_T4 is a non-physical proxy: the SMPL spine3 orientation
      plus an axial acceleration term at the chest proxy point pelvis + 2/3 (head - pelvis) (chest_alpha
      0.667), relabelled to the spec back frame; its gyro is derived, q_anatomical_from_sensor is identity,
      and imu_confidence is 0.4 against 0.7 on the physical channels.'
    consequence: 'Treat back_T4 as kinematic, not measured: exclude it (imu_confidence < 0.7, or gyro_provenance
      starting ''proxy_non_physical'') wherever a measured-sensor claim is made; the specific-force round-trip
      check does not apply to it.'
    evidence: DATA_DESCRIPTION_EN.md section 3.2 idx 0, section 3.4 ('n/a (proxy)'), section 7 'proxy
      (non-physical)' row and Key caveat 1; manifest.json small_sites_provenance.back_T4 'proxy_non_physical:spine3+axial',
      canonicalization_config.chest_alpha; small_reference.npz gyro_provenance[0], imu_confidence[:,0]
      = 0.4
    status: open
    since: '2026-08-18'
  - id: prism.insole_heading_unreferenced
    kind: hardware_limit
    severity: caution
    scope:
      level: site
      sites:
      - foot_l
      - foot_r
      arrays:
      - imu_orientation
      - imu_orientation_absolute_heading
      takes:
      - prism-subj001-take012
      - prism-subj001-take024
      - prism-subj003-take002
      - prism-subj003-take017
      - prism-subj004-take030
      - prism-subj004-take034
      - prism-subj004-take035
      - prism-subj005-take004
      - prism-subj006-take017
      - prism-subj006-take018
      - prism-subj006-take019
      - prism-subj006-take022
      files:
      - small_reference.npz
      - VALIDATION_REPORT.json
    statement: 'The Moticon OpenGo insoles are six-axis: gravity references their tilt and nothing references
      their heading, so the insole heading in small_reference.npz is the gyro integral and drifts (imu_orientation_absolute_heading
      = [T,T,T,T,T,T,F,F]). It wanders 0.17-0.65 deg/s on most feet across all 150 takes; on the twelve
      takes listed in scope.takes it is 2.4-45.9 deg/s, sweeping one to eight full turns, and VALIDATION_REPORT.json
      flags each as an L3 axes WARN (relabel dispersion 80-97 deg above the 75 deg band). Tilt stays sound
      throughout.'
    consequence: Do not read the insole heading in small_reference.npz as absolute; use its tilt only,
      or use the heading_synth_reference.npz companion when a usable heading is needed. The flag stays
      False because it describes the hardware.
    evidence: DATA_DESCRIPTION_EN.md section 3.1 row imu_orientation_absolute_heading, section 6.1, section
      7 Key caveat 3; small_reference.npz imu_orientation_absolute_heading; VALIDATION_REPORT.json findings
      (12 x L3 'axes' WARN); PRISM insole-heading investigation (parent project record, 2026-09-09) sections
      5.4, 5.6, 7
    status: mitigated
    mitigation: Per-take companion heading_synth_reference.npz (v2 method; written for this generation
      on 2026-09-15 by scripts/poc/synthesize_insole_heading.py; the 2026-09-09 v1 method is superseded)
      keeps the insole's own attitude and removes only the linear heading drift, fitted as a Theil-Sen
      trend through per-stride medians of the foot-vs-shank world-Z twist (strides from foot_contact_mask);
      the ankle's real rotation stays. Over 300 take/foot pairs relabel dispersion goes p95 72.7 -> 23.9
      deg, max 97.1 -> 33.4 deg, 12 -> 0 pairs above 75 deg, no pair worse than measured by more than
      5 deg. small_reference.npz is untouched.
    since: '2026-09-09'
    related:
    - prism.heading_synth_companion_is_estimate
    - prism.foot_gyro_axis_relabel
  - id: prism.heading_synth_companion_is_estimate
    kind: approximation
    severity: caution
    scope:
      level: array
      arrays:
      - imu_orientation
      - imu_orientation_heading_source
      - heading_shift_deg
      - heading_donor
      files:
      - heading_synth_reference.npz
      sites:
      - foot_l
      - foot_r
    statement: In heading_synth_reference.npz the two insole channels carry the insole's own heading with
      a fitted linear drift removed (imu_orientation_heading_source 'synthesized:insole_dedrifted_shank_trend';
      the other six channels are the shipped quaternions copied bit-for-bit). The drift is a per-take
      linear model anchored at the first frame, so any non-linear drift and any real heading change that
      is slow and monotone over the take remain confounded (three of the twelve drifting takes were piecewise,
      not linear); six of 300 pairs move 1-3.3 deg further from the segment than the measured attitude.
      imu_acceleration and imu_angular_velocity are not rewritten, so under the companion attitude f =
      R^T (a_world - g) does not hold in the horizontal dynamic component. It is not a measurement and
      never a substitute for small_reference.npz.
    consequence: Read imu_orientation_heading_source before using the array; read heading_drift_rate_deg_s
      and heading_stride_count to see what was removed and on how many strides it was fitted; use the
      measured attitude from small_reference.npz whenever the specific-force identity is required; never
      present the companion heading as a measurement.
    evidence: DATA_DESCRIPTION_EN.md section 6.1; heading_synth_reference.npz imu_orientation_heading_source,
      heading_drift_rate_deg_s, heading_stride_count, method; scripts/poc/synthesize_insole_heading.py;
      PRISM insole-heading investigation (parent project record, 2026-09-09) sections 5.7 and 6
    status: open
    since: '2026-09-09'
    related:
    - prism.insole_heading_unreferenced
  - id: prism.foot_gyro_axis_relabel
    kind: pipeline_defect
    severity: info
    scope:
      level: site
      sites:
      - foot_l
      - foot_r
      arrays:
      - imu_angular_velocity
      files:
      - small_reference.npz
    statement: The foot gyro was originally transformed as if the insole's gyr_local_raw shared the body
      frame of imu.ori; it does not, and a fixed relabel M mapping (a,b,c) -> (-a,c,b) was missing on
      all 150 takes (300/300 foot-takes converge on M, median 1.0 deg from it; with it a healthy foot's
      gyro integrates to its own orientation within 2.9 deg instead of 134.6 deg). The six body channels
      were never affected because their gyro is derived from orientation.
    consequence: Before using the foot gyro check manifest.small_measured.gyro_axis_relabel.applied ==
      true. This generation applies M at emit; a copy of the retired bundle taken before 2026-09-14T03:38Z
      carries the defect and must apply the recorded formula w_corrected = r_cal^T M r_cal w_shipped.
    evidence: manifest.json small_measured.gyro_axis_relabel (applied, channels, matrix, formula 'applied
      by generate_prism_measured.py at emit', applied_utc = generated_utc; all 150 takes); scripts/poc/generate_prism_measured.py
      GYR_LOCAL_AXIS_RELABEL and build_measured; DATA_DESCRIPTION_EN.md section 6.1 'foot gyro axes' callout;
      PRISM insole-heading investigation (parent project record, 2026-09-09) sections 5.1, 5.5
    status: fixed
    fixed_in: 'the generator since 2026-09-15: generate_prism_measured.py rotates gyr_local_raw
      by M at emit and writes the marker; the retired 2026-08-18 bundle had been rewritten in place on
      2026-09-14T03:38Z, with the original foot gyro of every take kept beside its rollback journal
      under _manifest_backfill/ where that generation was retired'
    since: '2026-09-09'
    related:
    - prism.insole_heading_unreferenced
  - id: prism.body_gyro_derived_from_orientation
    kind: approximation
    severity: info
    scope:
      level: site
      sites:
      - wrist_l
      - wrist_r
      - shank_l
      - shank_r
      - occiput
      arrays:
      - imu_angular_velocity
      - gyro_provenance
    statement: For the five physical body IMUs the angular velocity is the rotation-log of the calibrated
      physical orientation, not a measured rate; only the two insoles carry a measured gyro (gyr_local_raw).
    consequence: The body-site gyro inherits the noise and bias of the orientation stream rather than
      a gyroscope's; do not use it to characterise raw-rate noise. gyro_provenance names the source per
      channel.
    evidence: DATA_DESCRIPTION_EN.md section 3.2 'gyro source' column and section 7 'derived' row; manifest.json
      small_measured.gyro; small_reference.npz gyro_provenance[1..5] 'derived_from_orientation:rotation_log'
    status: open
    since: '2026-08-18'
  - id: prism.wrist_frames_gap_filled
    kind: coverage
    severity: caution
    scope:
      level: site
      sites:
      - wrist_l
      - wrist_r
      arrays:
      - imu_synth_mask
      - imu_orientation
      - imu_acceleration
      - imu_angular_velocity
    statement: 'The physical wrist streams contain frames the source gap-filled by interpolation. They
      are flagged per frame in imu_synth_mask and counted per take in manifest.small_measured.synth_frames:
      118 of 150 takes are affected (R_Wrist in 93 takes, L_Wrist in 25; e.g. subj001/take002 R_Wrist
      7,423 of 13,160 frames, subj004/take022 R_Wrist 6,520 of 6,520). imu_valid_mask stays True on these
      frames.'
    consequence: Mask imu_synth_mask frames out of any measured-only use; imu_valid_mask does not exclude
      them. The other six channels have zero synth frames.
    evidence: DATA_DESCRIPTION_EN.md section 3.1 row imu_synth_mask, section 3.2 idx 2, section 3.4, section
      7 Key caveat 2; manifest.json small_measured.synth_frames (per take); small_reference.npz imu_synth_mask
    status: open
    since: '2026-08-18'
    related:
    - prism.policy_excluded_sites_shipped_as_measured
  - id: prism.policy_excluded_sites_shipped_as_measured
    kind: source_defect
    severity: caution
    scope:
      level: site
      sites:
      - wrist_l
      - wrist_r
      - occiput
      arrays:
      - imu_orientation
      - imu_acceleration
      - imu_confidence
      - imu_synth_mask
    statement: 'The PRISM usage policy (finding A-1, CLEAN_SITES_ONLY) adopted only L_Foot, L_Knee, Pelvis,
      R_Foot and R_Knee as measured sites and excluded Head, L_Wrist and R_Wrist because their measured
      channels contain frames bit-identical to the model-derived companion (R_Wrist 93 files, L_Wrist
      25, Head 1 file with 1,915 frames the official mask does not declare). This bundle nevertheless
      ships wrist_l, wrist_r and occiput as measured_physical at confidence 0.7: at the wrists the bit-identical
      set equals the gap-fill set exposed by imu_synth_mask; at the head nothing is flagged, and the policy
      records the head''s measured orientation as orthonormal to 1e-6 like imu_gt.'
    consequence: Do not make an upper-limb or head 'measured IMU' claim from this bundle without the policy
      caveat; where measured-vs-model-derived matters, treat occiput as possibly model-derived and rely
      on imu_synth_mask at the wrists.
    evidence: configs/datasets/prism_usage_policy_v1.yaml measured_companion (adopted_sites, excluded_sites,
      excluded_sites_contaminated_files) and orientation.head_measured_orientation_is_already_orthonormal;
      manifest.json small_sites_provenance (occiput 'measured_physical:imu.Head') and prism_usage_policy.note;
      small_reference.npz imu_confidence[:,5] = 0.7, imu_synth_mask[:,5] all False
    status: open
    since: '2026-08-18'
    related:
    - prism.wrist_frames_gap_filled
  - id: prism.orientation_projected_to_so3
    kind: source_defect
    severity: info
    scope:
      level: site
      sites:
      - wrist_l
      - wrist_r
      - shank_l
      - shank_r
      - foot_l
      - foot_r
      arrays:
      - imu_orientation
    statement: PRISM's released physical imu.ori is slightly non-orthonormal (det 0.96-1.02 at foot, knee
      and wrist; the policy records max |det - 1| per site of 0.04-0.27, worst at R_Wrist; head is clean).
      The stored orientation is the nearest rotation after projection to SO(3).
    consequence: The shipped quaternion is a projected, not raw, released matrix; the deviation is a source-quality
      signal, and the round-trip a_world = R f + g holds to <= 3e-6 m/s^2 only because of the projection.
    evidence: DATA_DESCRIPTION_EN.md section 3.3 'Acceleration & orientation self-consistency'; manifest.json
      small_measured.orientation_projection; configs/datasets/prism_usage_policy_v1.yaml orientation (disposition
      SVD_POLAR_PROJECTION, per_site_measured_max_abs_det_minus_one)
    status: mitigated
    mitigation: SVD/polar projection to SO(3) with sign correction (policy B-3), verified by the <= 3e-6
      m/s^2 round-trip and 1.2e-7 quaternion-norm check recorded in manifest.validation.
    since: '2026-08-18'
  - id: prism.shank_sites_are_knee_units
    kind: approximation
    severity: info
    scope:
      level: site
      sites:
      - shank_l
      - shank_r
    statement: The spec's shank channels are populated from PRISM's imu.L_Knee and imu.R_Knee units, described
      by the bundle as an upper-shank (upper-anterior) proxy for the shank placement.
    consequence: Signals reflect an upper-shank/knee placement rather than a mid- or distal-shank mount;
      lever-arm and soft-tissue characteristics differ accordingly.
    evidence: DATA_DESCRIPTION_EN.md section 3.2 idx 3-4 ('physical imu.L_Knee (upper-shank proxy)');
      manifest.json small_sites_provenance.shank_l / shank_r 'measured_physical:imu.L_Knee / R_Knee'
    status: open
    since: '2026-08-18'
  - id: prism.no_sensor_mount_extrinsics
    kind: source_scope
    severity: caution
    scope:
      level: site
      sites:
      - back_T4
      - wrist_l
      - wrist_r
      - shank_l
      - shank_r
      - occiput
      - foot_l
      - foot_r
      arrays:
      - p_segment_to_sensor_m
    statement: 'The segment-to-sensor lever arm is unavailable: p_segment_to_sensor_m is all zeros and
      every site sits at its joint/segment origin. Only the rotational mount calibration q_anatomical_from_sensor
      is provided (identity for back_T4).'
    consequence: Lever-arm (centripetal and tangential) acceleration cannot be modelled or removed; do
      not fit or evaluate sensor-placement models on this bundle; the mount extrinsic is rotation-only.
    evidence: DATA_DESCRIPTION_EN.md section 3.1 row p_segment_to_sensor_m and section 7 Key caveat 4;
      manifest.json unavailable_or_not_applied 'sensor mount extrinsics'; small_reference.npz p_segment_to_sensor_m
      == 0 for all 8 sites
    status: open
    since: '2026-08-18'
  - id: prism.no_jcs_joint_angles
    kind: source_scope
    severity: info
    scope:
      level: array
      arrays:
      - joint_rotation
      files:
      - large_reference.npz
    statement: joint_rotation holds the pelvis global orientation and 17 SMPL parent-relative local quaternions;
      no ISB/JCS clinical joint angles (joint_angles_jcs_deg) are produced because no ISB/JCS convention
      was applied.
    consequence: Do not read joint_rotation as anatomical flexion/abduction/rotation angles; derive clinical
      angles yourself under a convention of your choosing, none is asserted by the bundle.
    evidence: DATA_DESCRIPTION_EN.md section 4 joint_rotation row and section 7 'unavailable / not applied'
      row; manifest.json unavailable_or_not_applied 'joint_angles_jcs_deg (needs ISB/JCS convention --
      not applied)'
    status: open
    since: '2026-08-18'
  - id: prism.no_canonical_kinetics
    kind: source_scope
    severity: info
    scope:
      level: bundle
    statement: Canonical SOMA-world GRF [T,3] and CoP [T,2], joint torques, and physics-informed moments,
      powers and COM are not produced (DETERMINISTIC_EXECUTION_CONFIG_HOLD). Insole kinetics exist only
      in development_reference.npz in source-native form.
    consequence: No kinetic supervision can be taken from the synthetic Small/Large pair; pair the bundle
      with a measured kinetics source when kinetics are needed.
    evidence: DATA_DESCRIPTION_EN.md section 6 and section 7 'unavailable / not applied' row; manifest.json
      unavailable_or_not_applied 'physics-informed GRF / inverse dynamics / moments / powers / COM' and
      data_specification_code_compatibility.unavailable_codes (grf, cop, joint_torques)
    status: open
    since: '2026-08-18'
    related:
    - prism.development_reference_not_supervision
    - prism.insole_grf_source_native_units
  - id: prism.development_reference_not_supervision
    kind: rights
    severity: caution
    scope:
      level: bundle
      files:
      - development_reference.npz
    statement: 'development_reference.npz (namespace development_reference/prism_insole_v1: per-foot GRF,
      CoP, contact mask) is development context only: generator_input false, supervision false. It is
      not part of the synthetic Small/Large pair.'
    consequence: Never use it as a generator input, a training label or an evaluation target.
    evidence: DATA_DESCRIPTION_EN.md section 6 and section 9 table; manifest.json faithful_content.development_reference;
      configs/datasets/dataset_profiles_v1.yaml profiles.prism.capabilities
    status: open
    since: '2026-08-18'
    related:
    - prism.no_canonical_kinetics
  - id: prism.insole_grf_source_native_units
    kind: source_scope
    severity: caution
    scope:
      level: array
      arrays:
      - grf_feet_source_native
      files:
      - development_reference.npz
      sites:
      - foot_l
      - foot_r
    statement: The insole ground-reaction force is stored in PRISM source-native units (grf_feet_source_native),
      not SI newtons; CoP is in metres and contacts are normalised to bool on load (policy C-8).
    consequence: Do not read the GRF array as newtons or compare it across datasets without a calibration
      the source does not provide.
    evidence: DATA_DESCRIPTION_EN.md section 6 ('PRISM source-native units, not SI N'); manifest.json
      prism_usage_policy.note ('Insole contacts normalized to bool (C-8)'); configs/datasets/prism_usage_policy_v1.yaml
      insole_dtype
    status: open
    since: '2026-08-18'
    related:
    - prism.no_canonical_kinetics
  - id: prism.anthro_source_units_undeclared
    kind: approximation
    severity: info
    scope:
      level: array
      arrays:
      - height
      - body_mass
      files:
      - anthro_reference.npz
    statement: height and body_mass are written in SOMA spec units (m, kg) but the PRISM subj_info units
      are undeclared upstream (policy C-7); height was interpreted as cm by value range and weight as
      kg. arm_length is excluded because it exceeds height for subj1 and has no official definition or
      unit.
    consequence: Treat the m/kg values as an assumed unit conversion of measured source values; no arm
      length is available.
    evidence: anthro_reference.npz height_provenance and body_mass_provenance ('source unit undeclared
      upstream'); manifest.json prism_usage_policy.note ('PRISM source subj_info units undeclared upstream
      (C-7); arm_length excluded'); configs/datasets/prism_usage_policy_v1.yaml anthropometry
    status: open
    since: '2026-08-18'
  - id: prism.pelvis_trajectory_trans_only
    kind: approximation
    severity: info
    scope:
      level: array
      arrays:
      - pelvis_position_world_aux
      - root_velocity
      - smpl_trans
      files:
      - large_reference.npz
      - smpl_root_translation.npz
    statement: The pelvis world trajectory follows PRISM's released trans-only rule (root_offset not added),
      whereas PRISM's documented rule is trans + root_offset; the policy measured a 0.21-0.26 m disagreement
      between the two (finding A-2) and requires derivatives to record that the documented rule was not
      followed.
    consequence: Absolute pelvis position is in the trans-only convention and can differ from PRISM's
      documented convention by about 0.2 m; state this when comparing against PRISM-native positions.
    evidence: manifest.json prism_usage_policy.note ('consistent with trans-only world (A-2; root_offset
      not added)'); configs/datasets/prism_usage_policy_v1.yaml world_translation (disagreement_metres,
      provenance_requirement)
    status: open
    since: '2026-08-18'
  - id: prism.reduced_model_weld_residual
    kind: approximation
    severity: caution
    scope:
      level: array
      arrays:
      - joint_rotation
      - fixed_joint_rotation
      files:
      - large_reference.npz
      - anthro_reference.npz
    statement: 'large is an 18-joint reduced model: spine1, spine2, left_collar and right_collar are frozen
      to constants (anthro.fixed_joint_rotation) that smpl18.reduce fits once per subject over the pooled
      frames of all of its takes, and spine3 and the shoulders absorb the removed rotation; distal global
      orientation is exact but a joint-centre position residual remains on the trunk/arm chain. Across
      the 6 fit groups the fitted residual RMS is 47.3-70.6 mm (the mean-rotation starting guess 49.4-76.1
      mm) and the worst frame is 257.6 mm (prism_subj006). Per take, overall_max is 0.050-0.259 m (worst
