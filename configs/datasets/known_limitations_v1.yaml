    kind: approximation
    severity: info
    scope:
      level: array
      arrays:
      - imu_confidence
      - imu_valid_mask
      files:
      - small_reference.npz
    statement: imu_confidence is the emitter's fixed per-site prior (0.4 on back_T4, 0.5 on foot_l / foot_r,
      0.6 elsewhere), a declared level, not a measurement, and not on the GAITEX (0.6 / 0.3 / 0.0) or
      PRISM (0.7 / 0.4) scale; the manifest declares no imu_confidence_semantics of its own. imu_valid_mask
      is all True on every take (emitted before the ADR-0039 mask-governed NaN rule of 2026-09-06); nothing
      was interpolated or withdrawn.
    consequence: Never compare imu_confidence across bundles or read it as measured channel reliability;
      do not use imu_valid_mask to find gaps (it marks none).
