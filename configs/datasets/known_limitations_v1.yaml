  - id: amass.anthro_per_sequence_not_per_subject
    kind: source_scope
    severity: info
    scope:
      level: bundle
      files:
      - anthro_reference.npz
    statement: Each AMASS npz carries its own MoSh betas, so betas and the rest skeleton are stored per
      sequence, and the frozen-joint constants are shared only by the sequences of one subject that have
      the same betas and body model (one fit group in reduced_model_fit.json). In this corpus every subject's
      sequences carry identical betas, so each of the 249 subjects is exactly one group; a future source
      release that varies betas within a subject would split it.
    consequence: Do not assume one skeleton per subject across takes; key anthro constants by pair_id,
      or by the fit group reduced_model_fit.json names for the take, not by subject_id.
    evidence: anthro_reference.npz subject_scope and subject_scope_note; reduced_model_fit.json takes
      and groups; DATA_DESCRIPTION_EN.md section 5 opening paragraph
