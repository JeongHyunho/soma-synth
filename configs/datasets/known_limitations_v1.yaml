  - id: hknu.pelvis_alignment_constant_v1
    kind: pipeline_defect
    severity: info
    scope:
      level: bundle
    statement: 'The retired hknu_unified8_v1 placed the body wrong by a constant: SMPL''s pelvis joint
      sits 17.7 mm in front of its own hip midpoint and Visual3D''s PV.ProxEndPos 44.2 mm in front of
      the measured one, and with only the two hip offsets as targets the fit paid that 26.5 mm displacement
      as a 23.4 deg rotation about the hip axis, which the lumbar rule carried into the trunk, head and
      arms (CoM 91.8 mm ahead of the laboratory CoM on walking). This bundle solves the pelvis constant
      from normalised anatomical directions with the translation in closed form.'
    consequence: 'None in this bundle: on the standing take the fitted trunk lean matches the measured
      lean to 0.00 deg across all twelve subjects. Any figure, slide or viewer tile quoted from v1 (the
      15-20 deg forward lean, the 90 mm CoM offset) is superseded.'
    evidence: DATA_DESCRIPTION_EN.md section 2 (first paragraph and change 1, table row 'CoM against the
      laboratory CoM'); HKNU fit diagnosis (parent project record, 2026-09-07); reports/hknu_fullbody_audit/fit_repair_2026-09-08/pelvis_placement_before.json
      and pelvis_placement_after.json, hknu_npose_skeleton.png
    status: fixed
    fixed_in: 'the 2026-09-14 hknu_unified8 generation (soma-synth run, record research/decisions/2026-09-14_hknu_experimental_generation_authorization.md)
      from hknu_smpl24_paired, the 2026-09-08 body-fit repair: pelvis alignment constant solved in closed
      form, lumbar zero from the subject''s standing take, rest skeleton scaled onto measured bone lengths,
      root solved per frame over hips, knees, ankles and shoulders'
    since: '2026-08-30'
    related:
    - hknu.pose_residual_above_baseline
  - id: hknu.lumbar_zero_from_standing_take
    kind: approximation
    severity: info
    scope:
      level: subject
    statement: The lumbar zero (the offset between the pelvis and thorax frames at neutral) is taken from
      each subject's own N-pose take rather than assumed to be parallel, because the source is a marker-driven
      Visual3D model whose frames are not parallel at neutral; the thirds rule then splits trunk rotation
      across spine1/2/3 from that zero.
    consequence: Trunk posture is referenced to the subject's own standing take; a subject whose N-pose
      was not neutral carries that offset into every take of theirs.
    evidence: DATA_DESCRIPTION_EN.md section 2 change 2; HKNU fit diagnosis (parent project record, 2026-09-07)
    status: open
    since: '2026-09-08'
  - id: hknu.root_solved_per_frame_shoulder_anchor_set
    kind: approximation
    severity: info
    scope:
      level: bundle
    statement: 'The root is solved per frame by least squares over eight measured joint centres (hips,
      knees, ankles, shoulders) rather than hung from the hip midpoint, because the source places its
      fifteen segments independently and its joint-centre chain does not close (adjacent segments disagree
      about a shared joint by 6.8 mm sd through a stride). The anchor set stops at the shoulders on purpose:
      adding elbows and wrists raised balance R^2 further but pushed the knee residual to 36 mm, past
      the 35 mm the audit set.'
    consequence: pelvis_position_world_aux is a least-squares placement against eight centres, not the
      laboratory PV.ProxEndPos frame for frame; a constant per-trial offset between the two (about 27
      mm on walking) is expected and is not a drift.
    evidence: DATA_DESCRIPTION_EN.md section 2 change 4 and the paragraph 'Stopping at the shoulders is
      deliberate'; reports/hknu_fullbody_audit/fit_repair_2026-09-08/ap_root_anchor_sets.txt; scripts/diagnostics/hknu_large_mech.py
      header (frame alignment paragraph)
    status: open
    since: '2026-09-08'
  - id: hknu.balance_metric_mass_model_floor
    kind: approximation
    severity: info
    scope:
      level: bundle
    statement: 'Against the laboratory the vertical CoM offset stays at -26.7 mm and running anteroposterior
      balance R^2 at 0.029 (laboratory 0.754), and both are limits of the comparison''s mass model rather
      than of the body: the metric places segment masses at SMPL part vertex means where the laboratory
      uses its own Segment.CoMPos (head 138 mm, thorax 76 mm apart), and the 2.4 mm stride-locked CoM
      difference that remains after mass-weighted cancellation is multiplied by (2 pi f)^2 in the force
      residual, 0.067 BW at running''s 2.50 Hz. A geometrically exact N-pose fit still reports 32.7 mm
      of vertical offset through the same metric.'
    consequence: 'Do not read the vertical offset or the running balance R^2 as a fit error: joint centres,
      segment lengths and orientations, which this bundle carries, do not depend on where the masses sit.
      Quote balance figures with this stated.'
    evidence: DATA_DESCRIPTION_EN.md section 2 paragraph 'Two things this did not fix' and section 7;
      reports/hknu_fullbody_audit/fit_repair_2026-09-08/ap_gap_attribution.txt and running_ap_spectrum.json;
      HKNU fit diagnosis (parent project record, 2026-09-07)
    status: open
    since: '2026-09-08'
