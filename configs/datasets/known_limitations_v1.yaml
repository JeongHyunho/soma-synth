  - id: addbiomechanics.foot_heading_flag_spec_sensor
    kind: hardware_limit
    severity: info
    scope:
      level: site
      sites:
      - foot_l
      - foot_r
      arrays:
      - imu_orientation_absolute_heading
      files:
      - small_reference.npz
    statement: imu_orientation_absolute_heading is [T,T,T,T,T,T,F,F] because the spec's foot sensor is
      a six-axis insole with no heading reference; the flag describes what the target sensor provides,
      not how this bundle was made. Here the foot orientations are FK-derived and do carry a world heading.
    consequence: A model trained on these foot orientations for deployment on the spec's insoles must
      not depend on foot heading; the flag, not the array, says what the real sensor will give.
    evidence: small_reference.npz imu_orientation_absolute_heading; README.md small_reference.npz field
      table row imu_orientation_absolute_heading ('False = gravity-referenced only (insole feet)'); scripts/poc/unified8_emit.py
      (absolute-heading constant shared with scripts/poc/generate_amass_faithful.py)
    status: open
