  - id: gaitex.mask_governed_nan_cells
    kind: coverage
    severity: caution
    scope:
      level: array
      arrays:
      - imu_orientation
      - imu_acceleration
      - imu_angular_velocity
      - imu_valid_mask
      - imu_confidence
      files:
      - small_reference.npz
    statement: Where a site has no signal (a marker gap the 20-frame policy does not bridge, the 17-frame
      filter edge of every usable run, a withdrawn glitch) the cell is NaN in the three IMU arrays, False
      in imu_valid_mask and 0.0 in imu_confidence; nothing is zero-filled. Summing source_window.invalid_cells
      over the 72 manifests gives 42,583 invalid cells of 12,496,320 (0.34%) on 33 takes; three (take,
