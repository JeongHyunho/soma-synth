      an all-True mask') and field table row imu_confidence ('set per corpus and NOT comparable between
      corpora'); small_reference.npz imu_confidence (constant per site) and imu_valid_mask (all True);
      scripts/poc/unified8_emit.py FAITHFUL.SITE_CONFIDENCE
    status: open
