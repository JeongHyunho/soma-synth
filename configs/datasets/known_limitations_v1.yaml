  - id: addbiomechanics.accel_lowpass_7hz
    kind: approximation
    severity: info
    scope:
      level: array
      arrays:
      - imu_acceleration
      files:
      - small_reference.npz
    statement: The specific force at every site is a 4th-order Butterworth 7 Hz zero-phase (filtfilt)
      filtered double difference of the joint's world position (canonicalization_config.filter butter4_7hz_filtfilt_odd15).
