  - id: addbiomechanics.reduced_model_weld_residual
    kind: approximation
    severity: info
    scope:
      level: array
      arrays:
      - joint_rotation
      - fixed_joint_rotation
      files:
      - large_reference.npz
      - anthro_reference.npz
    statement: 'large is an 18-joint reduced model: spine1, spine2, left_collar and right_collar are frozen
      to constants (anthro.fixed_joint_rotation) that smpl18.reduce fits once per subject over the pooled
      frames of all of its takes, and spine3 and the shoulders absorb the removed rotation; distal global
      orientation is exact but a joint-centre position residual remains on the trunk/arm chain. Across
      the 1085 fit groups the fitted residual RMS is 0.0-65.3 mm (the mean-rotation starting guess 0.0-86.4
      mm) and the worst frame is 162.0 mm (addbio_Camargo2021_Formatted_No_Arm_AB15_split2). 1 group(s)
      stopped at the evaluation cap without converging: addbio_Tiziana2019_Formatted_No_Arm_Subject26.'
    consequence: FK from large + anthro reproduces shoulder, elbow, wrist, neck and head positions only
      to the residual recorded per fit group in reduced_model_fit.json and per take in manifest.validation.reduced_model_fit_residual_m;
      read them before relying on reconstructed positions.
    evidence: reduced_model_fit.json at the bundle root (groups[*].residual_fitted_m, residual_initial_m,
      per_joint_rms_m, converged, settings); manifest.json anthro_reconstruction.reduced_model_fit and
      validation.reduced_model_fit_residual_m; anthro_reference.npz fixed_joint_rotation_provenance
    status: mitigated
    mitigation: large_reference.npz smpl_global_orientation_world[M,24,4] keeps all 24 SMPL joints' global
      orientation losslessly (manifest.anthro_reconstruction.lossless_alternative); use it when exact
      per-joint orientation matters.
    since: '2026-08-31'
