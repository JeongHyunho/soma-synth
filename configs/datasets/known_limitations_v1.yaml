    statement: 'large is an 18-joint reduced model: spine1, spine2, left_collar and right_collar are frozen
      to constants (anthro.fixed_joint_rotation) that smpl18.reduce fits once per subject group (one subject,
      one body model and one set of MoSh betas) over the pooled frames of all of its takes, and spine3
      and the shoulders absorb the removed rotation; distal global orientation is exact but a joint-centre
      position residual remains on the trunk/arm chain. Across the 249 fit groups the fitted residual
      RMS is 8.8-96.2 mm (the mean-rotation starting guess 8.8-108.3 mm) and the worst frame is 334.1
      mm (amass_CMU_26|M|betas:2b13b2858784).'
