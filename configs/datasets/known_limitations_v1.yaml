      segment_length; reproduce the skeleton with betas[:10].
    evidence: anthro_reference.npz betas_provenance; DATA_DESCRIPTION_EN.md section 5 and Key caveat 4;
      manifest.json faithful_content.anthro ('betas(16, model uses 10)')
