  "gap_policy": {
    "max_interpolated_gap_frames": 20,
    "window_frames": 1000,
    "stride_frames": 500,
    "max_estimated_fraction": 0.02,
    "note": "The 20-frame limit covers 388 of the 437 observed sub-three-marker runs while interpolating only 1450 frames in 1.85 million. Raising it to 100 would recover a further 1355 frames, because the run-length distribution is bimodal: p50 is 2 frames but 19 runs longer than a second hold 89 percent of the lost frames. Twenty frames is also the same order as the zero-phase filter's own impulse response, beyond which an interpolated stretch would start contaminating its neighbours' derivatives."
  },
  "filter": {
    "type": "butterworth",
    "order": 4,
    "zero_phase": true,
    "cutoff_hz": 12.0,
    "edge_trim_frames": 17,
    "note": "At 12 Hz the propagated acceleration noise is 0.27 m/s^2 against a signal RMS of 6.18, a signal-to-noise ratio of 27.3 dB. 99.61 percent of vertical position power lies below 6 Hz and 0.0068 percent between 15 and 30 Hz. The consequence, recorded rather than hidden: impact transients above the cut-off are not reproduced. The owner directed on 2026-09-03 that impact transients are a minor concern for this source, and this cut-off follows that direction. That is an owner decision on record, not an independent review: hold_status.independent_review in this same file remains NOT_PERFORMED. Corrected 2026-09-04, which also measured the band edge: zero-phase filtering applies the 4th-order response twice, so the chain reaches a gain of 0.726 at 10 Hz, below the 12 Hz cut-off rather than above it."
  },
