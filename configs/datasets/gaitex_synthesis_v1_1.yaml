    "edge_tolerance_m": 0.0015,
    "planarity_tolerance_m": 0.0005,
    "note": "CORRECTED 2026-09-03 after the corpus run. An earlier 13-trial sample was averaged ACROSS sites and appeared to show one standardised plate; measuring all 73 trials site by site shows otherwise. Each site's plate is highly reproducible -- within-site scatter across trials is at most 0.472 mm -- but the eight plates differ from each other by up to 2.076 mm on one edge. A single global reference with a 1.0 mm tolerance therefore failed 164 of 364 site-trials, concentrated on shank_r (1.542 mm from the old global mean) and foot_l (1.320 mm). The reference is now per site and the tolerance is 1.5 mm, roughly three times the observed within-site scatter. pelvis, thigh_l and thigh_r are measured and kept here although no virtual sensor site is declared at them: GAITEX mounts real sensors there, and the eight-plate spread quoted above is what establishes that the plates are not interchangeable. No code path reads those three entries; they are evidence for the tolerance, not inputs to it."
