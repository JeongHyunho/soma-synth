  "forearm_conditioning": {
    "styloid_pair_distance_tolerance_m": 0.01,
    "max_rate_deg_per_s": 2000.0,
    "note": "The three upper-limb markers are not a rigid body (HLE is on the humerus), so the plate rigidity test cannot be applied; these two tests replace it. Measured 2026-09-06 over 146 arm-trials (73 trials x 2 sides) after the occlusion sentinel and the 10 m/s speed ceiling: the radial-ulnar styloid distance has a within-trial standard deviation of 0.59 mm median, 1.45 mm at the 95th percentile and 5.2 mm at most, while its largest frame-to-frame jump is 6.3 mm median, 21 mm at the 90th percentile and 142 mm at most -- the latter are label swaps and ghost markers, and 10 mm separates the two populations. The unfiltered frame-to-frame rotation rate of the anatomical frame has a 99th percentile of 213 deg/s median and 1281 deg/s at most, while 11 of 146 arm-trials carry single-frame steps above 2000 deg/s (up to 4603), which no forearm produces in gait; the ceiling withdraws both frames of such a step. Neither value was tuned against a validator outcome; both sit between the measured populations they separate. Added in 1.1.1: max_gap_twist_deg and label_swap_max_withdrawn_fraction. A radial/ulnar label swap leaves the styloid-pair distance unchanged and, inside a gap, escapes the rate ceiling too; it is a half turn about the forearm axis, so the twist about +Y across every interior gap of the usable series is measured, and each crossing above max_gap_twist_deg flips the labelling parity of what follows. No GAITEX marker says which parity is anatomical, so the parity with more usable frames is kept and the other is withdrawn (never relabelled) and listed on the manifest; when the minority exceeds label_swap_max_withdrawn_fraction of the usable frames the majority is no longer a reason and the site is refused for the take. Measured 2026-09-07 over the 144 wrist-trials: two trials carry a swapped island about 100 frames long (178-179 deg across the gap on either side of it, austra/ng wrist_r and yaxkin/ng wrist_l), the next largest crossing is 71 deg, so 90 deg separates the two populations. A trial swapped throughout has no crossing and is not detected.",
